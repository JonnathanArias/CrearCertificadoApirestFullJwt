spring:
  application:
    name: ApiRestfull
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=TU_BASE_DE_DATOS;encrypt=false
    username: TU_USUARIO
    password: TU_CONTRASEÑA
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
    properties:
      hibernate:
        format-sql: true
    open-in-view: false

jwt:
  secret: "TU_CLAVE_SECRETA_EN_BASE64"
  expiration: 3600000